services:
  majalengka-tech:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: majalengka-tech
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env
    volumes:
      - data-storage:/app/.data

volumes:
  data-storage:
