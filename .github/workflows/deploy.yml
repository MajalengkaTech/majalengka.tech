name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploy berikutnya menunggu, tidak membatalkan deploy yang sedang berjalan di tengah migrasi.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Action pihak ketiga dikunci ke hash commit, bukan tag yang bisa dipindah.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

  deploy:
    needs: check
    runs-on: ubuntu-latest
    # Secret deploy disimpan di environment ini, yang hanya boleh dipakai branch main.
    environment: production
    timeout-minutes: 30
    steps:
      - name: Deploy ke VPS
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Host key dipatok lewat VPS_KNOWN_HOSTS; kunci ini di VPS hanya bisa menjalankan skrip deploy.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "ubuntu@$VPS_HOST" "$GITHUB_SHA"

      - name: Cek situs setelah deploy
        run: curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors -o /dev/null https://majalengka.tech/
