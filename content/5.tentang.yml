title: Tentang Majalengka Tech
description: Etalase karya developer dan desainer dari Majalengka, atau yang berkarya untuk Majalengka. Tempat untuk menunjukkan apa yang sudah kamu buat, melihat karya orang lain, dan saling mengenal.
seo:
  title: Tentang Majalengka Tech
  description: Siapa kami dan prinsip yang kami pegang dalam mengelola etalase karya kreator Majalengka.
navigation: false
features:
  title: Prinsip yang kami pegang
  description: Aturan yang sudah kami terapkan di situs ini, bukan sekadar niat.
  items:
    - title: Kodenya terbuka
      description: Kode situs ini berlisensi MIT dan bisa dipelajari, dipakai, atau diperbaiki siapa saja di GitHub.
      icon: i-lucide-unlock
    - title: Data yang jujur
      description: Setiap angka di situs ini dihitung dari karya yang sudah terbit. Kami tidak menampilkan testimoni, statistik, atau contoh karya karangan.
      icon: i-lucide-badge-check
    - title: Nyaman dipakai siapa saja
      description: Setiap pasangan warna teks dan latar kami cek agar lolos standar kontras WCAG AA, dan gambar karya bisa diberi keterangan untuk pembaca layar.
      icon: i-lucide-accessibility
    - title: Gratis untuk kreator
      description: Memamerkan karya, membuat profil, memberi apresiasi, dan berkomentar tidak dipungut biaya.
      icon: i-lucide-heart-handshake
    - title: Terbuka untuk kolaborasi
      description: Mahasiswa, pelaku UMKM, komunitas, maupun developer dari luar daerah bisa ikut berdiskusi dan membangun bersama.
      icon: i-lucide-users
cta:
  title: Mau ikut membangun?
  description: Pamerkan karyamu, atau bantu memperbaiki situs ini lewat GitHub.
  links:
    - label: Pamerkan Karyamu
      to: /dashboard/projects/new
      icon: i-lucide-folder-plus
    - label: Buka GitHub Majalengka Tech
      to: https://github.com/majalengkatech
      target: _blank
      trailing: true
      icon: i-simple-icons-github
      color: neutral
      variant: outline
