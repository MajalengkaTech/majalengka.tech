faq:
  title: Pertanyaan Umum (FAQ)
  description: Hal-hal yang sering ditanyakan seputar keberlanjutan dan kontribusi di Majalengka Tech.
  items:
    - label: Apakah menggunakan platform Majalengka Tech berbayar?
      content: Tidak sama sekali. Seluruh fitur showcase projek, dokumentasi teknologi, dan bacaan blog 100% gratis dan terbuka untuk umum.
    - label: Bagaimana komunitas membiayai operasional website dan server?
      content: Platform ini dikelola secara efisien menggunakan layanan edge modern gratis (Cloudflare, GitHub) dan didukung gotong royong komunitas bila dibutuhkan biaya domain serta event offline.
    - label: Siapa saja yang boleh memamerkan projek di showcase?
      content: Siapa pun, baik pelajar, mahasiswa, profesional, perintis UMKM, maupun penghobi teknologi asal Majalengka atau yang karyanya bermanfaat untuk daerah Majalengka.
    - label: Bagaimana cara saya ikut menjadi relawan atau kontributor kode?
      content: Anda cukup membuka repositori GitHub Majalengka Tech, membaca panduan berkontribusi di dokumentasi, dan mengirimkan pull request atau membuka issue diskusi.
