title: Membangun Ekosistem [Teknologi & Open Source]{class="text-primary"} dari Majalengka
description: Rumah kumpul para pengembang, desainer, dan pegiat teknologi di Majalengka. Kami bikin proyek open source, utak-atik riset lokal dari lereng Ciremai, dan berbagi ilmu bareng warga.
seo:
  title: Majalengka Tech · Komunitas Open Source & Teknologi Daerah
  description: Portal komunitas Majalengka Tech. Eksperimen smart farming IoT, panduan wisata terbuka, perkakas UMKM, kelas coding gratis, dan standar desain daerah.
navigation: false
hero:
  links:
    - label: Lihat Program Kami
      icon: i-lucide-arrow-right
      trailing: true
      to: /docs/inisiatif
      size: xl
    - label: GitHub Majalengka Tech
      icon: i-simple-icons-github
      size: xl
      color: neutral
      variant: subtle
      to: https://github.com/majalengka-tech
      target: _blank
sections:
  - title: Proyek Nyata untuk Kebutuhan Warga
    description: Bukan sekadar memakai teknologi luar, kami merancang dan membagikan solusi yang beneran kepake buat masalah sehari-hari di Majalengka.
    id: inisiatif
    orientation: horizontal
    features:
      - title: AgriTech & Sensor Pertanian IoT
        description: Pantau kelembaban tanah, suhu lereng Ciremai, dan otomatisasi siram tanaman hemat biaya berbasis ESP32.
        icon: i-lucide-sprout
      - title: Panduan Wisata Terbuka
        description: Peta digital berbasis data terbuka untuk jelajah Panyaweuyan, Situ Cipanten, dan tempat kuliner lokal.
        icon: i-lucide-map-pin
      - title: Perkakas Gratis buat UMKM
        description: Aplikasi kasir ringan di HP, generator katalog produk online, dan template QRIS siap pakai tanpa biaya langganan.
        icon: i-lucide-store
  - title: Standar Desain & Pengetahuan Terbuka
    description: Kami merancang sistem yang gampang dipahami manusia maupun AI — jelas strukturnya, dan ramah diakses siapa saja.
    id: standards
    orientation: horizontal
    reverse: true
    features:
      - title: Majalengka Design System (MDS)
        description: Panduan desain antarmuka bersih dan ramah pembaca layar (standar aksesibilitas WCAG 2.1 AA) untuk website publik daerah.
        icon: i-lucide-palette
      - title: Open Knowledge Format (OKF)
        description: Standarisasi penulisan dokumentasi berbasis Google Cloud OKF v0.2 agar data komunitas siap dibaca agen AI cerdas.
        icon: i-lucide-brain
      - title: Data Terbuka & Visualisasi Publik
        description: Grafik ringkas produksi komoditas lokal, cuaca mikro, dan informasi daerah yang bisa dicek siapa pun.
        icon: i-lucide-bar-chart-3
features:
  title: Prinsip yang Kami Pegang
  description: Nilai dasar tiap kali kami menulis baris kode dan menjalankan proyek bersama warga Majalengka.
  items:
    - title: 100% Terbuka & Bebas Dipelajari
      description: Semua kode aplikasi, skema rangkaian alat IoT, dan data kami rilis dengan lisensi open source (MIT/Apache).
      icon: i-lucide-unlock
    - title: Nyaman Dipakai Siapa Saja
      description: Kami pastikan kontras warna jelas, ukuran teks pas, dan navigasi ramah pembaca layar (WCAG 2.1 AA).
      icon: i-lucide-accessibility
    - title: Buka Akses Belajar Anak Muda
      description: Modul coding web dan materi AI kami sediakan gratis untuk pelajar SMK/SMA dan mahasiswa kampus lokal.
      icon: i-lucide-graduation-cap
    - title: Siap Kolaborasi dengan AI
      description: Dokumentasi rapi dengan format markdown terstruktur dan standar OKF agar gampang dibaca agen AI otonom.
      icon: i-lucide-cpu
    - title: Dekat dengan Budaya Lokal
      description: Kami sematkan pilihan Basa Sunda halus dan info kearifan lokal di aplikasi wisata dan panduan warga.
      icon: i-lucide-heart
    - title: Kerja Bareng Lintas Bidang
      description: Kami ngobrol langsung dengan kelompok tani, mahasiswa, dinas terkait, sampai pengembang software luar kota.
      icon: i-lucide-users
testimonials:
  headline: Kata Mereka
  title: Suasana Kolaborasi di Majalengka Tech
  description: Pengalaman langsung dari teman-teman pengembang, pegiat agritech, akademisi, dan pelaku usaha lokal.
  items:
    - quote: Dulu kami bingung mau uji coba sensor tanah di mana. Lewat komunitas ini, kami bisa langsung pasang alat bareng kelompok tani di kebun lereng Argapura. Pengalaman lapangannya kerasa banget!
      user:
        name: Rian Kurniawan
        description: Pegiat IoT & Mahasiswa UNMA
        to: /docs/inisiatif
        target: _self
        avatar:
          src: https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&h=120&q=80
    - quote: Template katalog online gratisnya ngebantu banget pas saya mau nawarin mangga gedong gincu dan olahan kopi ke luar kota. Ga pusing mikir biaya sewa bikin web.
      user:
        name: Siti Nurhaliza
        description: Pelaku UMKM Kuliner Majalengka
        to: /docs/inisiatif
        target: _self
        avatar:
          src: https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&w=120&h=120&q=80
    - quote: Bagusnya di sini, kita sepakat bikin standar desain bareng. Jadi waktu bikin portal layanan publik daerah, tampilannya konsisten, enteng dibuka, dan ramah pengguna.
      user:
        name: Asep Hidayat
        description: Frontend Developer & Kontributor Komunitas
        to: /docs/design-system
        target: _self
        avatar:
          src: https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=120&h=120&q=80
cta:
  title: Mau Belajar Bareng atau Ikut Bangun Proyek?
  description: Pintu komunitas kami selalu terbuka buat kamu yang suka ngoding, desain grafis, riset sensor, atau sekadar penasaran dengan dunia teknologi di Majalengka.
  links:
    - label: Buka GitHub Majalengka Tech
      to: https://github.com/majalengka-tech
      target: _blank
      trailing: true
      icon: i-simple-icons-github
    - label: Baca Dokumentasi
      to: /docs
      variant: subtle
      icon: i-lucide-book-open
