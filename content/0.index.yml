title: Ekosistem [Teknologi & Open Source]{class="text-primary"}
description: Rumah kumpul para pengembang, desainer, dan pegiat teknologi di Majalengka. Kami merancang proyek open source, menyiapkan riset teknologi lokal dari lereng Ciremai, dan belajar bareng warga.
seo:
  title: Majalengka Tech · Komunitas Open Source & Teknologi Daerah
  description: Portal komunitas Majalengka Tech. Eksplorasi roadmap smart farming IoT, panduan wisata terbuka, perkakas UMKM, kelas coding gratis, dan standar desain daerah.
navigation: false
hero:
  links:
    - label: Lihat Roadmap Inisiatif
      icon: i-lucide-arrow-right
      trailing: true
      to: /docs/inisiatif
      size: xl
    - label: GitHub Majalengka Tech
      icon: i-simple-icons-github
      size: xl
      color: neutral
      variant: subtle
      to: https://github.com/majalengka-tech
      target: _blank
sections:
  - headline: Roadmap Inisiatif
    title: Rencana Proyek untuk Kebutuhan Warga
    description: Peta jalan (*roadmap*) inisiatif teknologi yang sedang dan akan kami rancang secara terbuka. Belum semua rilis, dan kami membuka pintu selebar-lebarnya buat kamu yang mau ikut urun ide atau ngoding bareng.
    id: inisiatif
    orientation: horizontal
    features:
      - title: AgriTech & Sensor Pertanian
        badge: Coming Soon
        description: Rencana eksperimen sensor tanah dan pemantauan iklim mikro lereng Ciremai untuk membantu efisiensi irigasi petani lokal.
        icon: i-lucide-sprout
      - title: Panduan Wisata Terbuka
        badge: Coming Soon
        description: Rencana direktori peta digital berbasis data terbuka untuk jelajah wisata alam (Panyaweuyan, Situ Cipanten) dan direktori kuliner lokal.
        icon: i-lucide-map-pin
      - title: Perkakas Digital UMKM
        badge: Coming Soon
        description: Rencana pembuatan aplikasi kasir ringan (POS) dan generator katalog produk online gratis tanpa biaya sewa aplikasi.
        icon: i-lucide-store
  - headline: Riset Standar Terbuka
    title: Standar Desain & Pengetahuan Terbuka
    description: Eksplorasi awal untuk merapikan cara kita mengelola dokumentasi dan antarmuka publik daerah agar mudah dipelajari manusia maupun sistem AI cerdas.
    id: standards
    orientation: horizontal
    reverse: true
    features:
      - title: Majalengka Design System
        badge: Tahap Konsep
        description: Rintisan panduan desain antarmuka bersih dan ramah pembaca layar (WCAG 2.1 AA) yang terinspirasi IDDS untuk website layanan daerah.
        icon: i-lucide-palette
      - title: Open Knowledge Format
        badge: Eksplorasi
        description: Eksplorasi format pencatatan dokumen terstruktur (mengadopsi Google Cloud OKF) agar dokumentasi komunitas siap dibaca agen AI.
        icon: i-lucide-brain
      - title: Data Terbuka & Visualisasi Publik
        badge: Rencana
        description: Rencana pengumpulan dan visualisasi grafik data komoditas pertanian dan cuaca mikro yang bisa dicek publik secara transparan.
        icon: i-lucide-bar-chart-3
features:
  title: Prinsip yang Kami Pegang
  description: Nilai dasar tiap kali kami menulis baris kode dan merancang proyek bersama warga Majalengka.
  items:
    - title: 100% Terbuka & Bebas Dipelajari
      description: Semua rancangan kode aplikasi, skema alat IoT, dan data dirilis dengan lisensi open source (MIT/Apache).
      icon: i-lucide-unlock
    - title: Nyaman Dipakai Siapa Saja
      description: Kami mengutamakan kontras warna yang jelas, teks mudah dibaca, dan navigasi ramah pembaca layar (WCAG 2.1 AA).
      icon: i-lucide-accessibility
    - title: Buka Akses Belajar Anak Muda
      description: Modul coding web dan materi teknologi kami sediakan gratis untuk pelajar SMK/SMA dan mahasiswa kampus lokal.
      icon: i-lucide-graduation-cap
    - title: Siap Kolaborasi dengan AI
      description: Dokumentasi rapi dengan format markdown terstruktur dan standar OKF agar gampang dibaca agen AI otonom.
      icon: i-lucide-cpu
    - title: Dekat dengan Budaya Lokal
      description: Kami menyiapkan opsi Basa Sunda halus dan info sejarah lokal yang akurat di aplikasi wisata dan panduan warga.
      icon: i-lucide-heart
    - title: Terbuka untuk Kolaborasi
      description: Siap ngobrol dan bekerja sama dengan kelompok tani, mahasiswa, dinas terkait, maupun developer luar daerah.
      icon: i-lucide-users
testimonials:
  headline: Aspirasi Komunitas
  title: Harapan & Semangat Kolaborasi
  description: Pandangan dari teman-teman pengembang, pegiat agritech, akademisi, dan pelaku usaha lokal menyambut inisiatif ini.
  items:
    - quote: Keren banget kalau ada wadah buat anak-anak teknik Majalengka bisa langsung ngoprek sensor IoT bareng petani di lapangan lereng Ciremai. Semoga cepat terealisasi riset pertamanya!
      user:
        name: Rian Kurniawan
        description: Pegiat IoT & Mahasiswa UNMA
        to: /docs/inisiatif
        target: _self
        avatar:
          src: https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&h=120&q=80
    - quote: Semoga perkakas katalog online dan kasir gratisnya segera rilis. Pedagang kecil kayak kami sangat butuh solusi digital yang praktis tanpa beban biaya langganan bulanan.
      user:
        name: Siti Nurhaliza
        description: Pelaku UMKM Kuliner Majalengka
        to: /docs/inisiatif
        target: _self
        avatar:
          src: https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&w=120&h=120&q=80
    - quote: Rintisan standar desain lokal ini ide yang sangat bagus. Siap ikut urun tenaga biar ke depannya portal informasi dan layanan publik di daerah kita tampilannya seragam, rapi, dan enteng.
      user:
        name: Asep Hidayat
        description: Frontend Developer & Kontributor Komunitas
        to: /docs/design-system
        target: _self
        avatar:
          src: https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=120&h=120&q=80
cta:
  title: Mau Ikut Merancang atau Ngobrol Bareng?
  description: Karena inisiatif ini baru dimulai, setiap ide, masukan, dan baris kode yang kamu sumbangkan bakal berdampak besar bagi arah komunitas Majalengka Tech.
  links:
    - label: Buka GitHub Majalengka Tech
      to: https://github.com/majalengka-tech
      target: _blank
      trailing: true
      icon: i-simple-icons-github
    - label: Baca Roadmap Dokumentasi
      to: /docs
      variant: subtle
      icon: i-lucide-book-open
